name: Lucid Assay (dogfood)

# Runs this repo's own real build through the real Lucid platform:
# lucid-assay scores it into a Release Confidence Score attestation,
# this repo's own already-deployed sign-client.yml signs it via Sigstore
# keyless OIDC (and constructs real SLSA v1.0 provenance for it, Build
# Level 3, inside that isolated signer job), and the verify job runs the
# same admission gate a downstream consumer would run.
#
# FIRST REAL RUN FOR THIS REPO -- unlike lucid-assay/lucid-console/
# lucid-dsse-collector's own copies of this file, there is no prior
# observed RCS baseline to tune --min-rcs against yet (see those repos'
# own header comments for how theirs got set only after a real run, not
# guessed up front). Left at a true placeholder (0) below deliberately --
# raise it once a real score is observed, same methodology, not before.
#
# NOT A CONTAINER: this repo deploys a zip-based AWS SAM Lambda
# (`sam build` -> `sam deploy`), unlike every other repo's own copy of
# this file. --subject-name/--subject-digest (not --image-ref/--image-
# digest) describe the actual SAM-built Lambda function package instead
# -- see the "Build SAM package" step below for exactly what's hashed
# and why.
#
# Blocked until 2026-09-02 by cli.main requiring a container-image
# subject (--image-ref/--image-digest, both required=True) -- resolved
# the same day by generalizing to --subject-name/--subject-digest. Was
# unblocked but never actually wired in until now -- see the Lucid
# vault's lucid-attest-service repo note, "Known gaps".
#
# Deliberately does NOT self-reference an in-review/unmerged version of
# this repo's own sign-client.yml: the `attest` job's `uses:` pin below
# is the same already-deployed, already-trusted commit every external
# caller (lucid-console, lucid-dsse-collector) currently points at, not
# `@main` or this run's own commit SHA. An in-flight PR to this repo
# using its own not-yet-reviewed code to sign its own dogfood attestation
# would let that PR forge its own "verified" badge -- exactly the
# caller-chosen-code problem the whole isolated-signer design exists to
# prevent, just self-inflicted instead of external.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

# Cancels a now-stale run for the same PR/branch when a newer commit
# supersedes it (several quick pushes to one PR no longer leave older
# runs going alongside the current one, burning CI minutes). Keyed by
# github.event_name as well as the PR/ref: push here only ever targets
# `main` and pull_request only ever targets an open PR's own branch, so
# the two can't collide on one commit the way lucid-assay's own
# feat/**-branch push trigger can -- this is a consistency/safety-net
# choice, not a fix for an overlap that exists in this repo today.
# github.event.pull_request.number (not github.ref, the synthetic
# "<number>/merge" ref on a pull_request event) groups a PR's own
# synchronize-triggered runs together across pushes.
#
# The push/workflow_dispatch fallback is github.sha, not github.ref --
# fixed alongside folding `deploy` into this workflow (see that job's
# own comment): with `deploy` now part of this same run, keying by
# github.ref alone would group *every* push to main into one
# concurrency slot forever, so a second push landing while an earlier
# commit's `deploy` job is mid-flight would cancel that in-progress
# deploy outright -- the exact class of bug found and fixed in
# lucid-dsse-collector's own copy of this file on 2026-09-13.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# No id-token: write at the workflow level -- granted only to `attest`
# and `deploy` (job-level overrides, both below). `build` runs this
# repo's own tests and builds its real SAM package; it must never be
# able to reach the Sigstore signing credential itself, and critically
# must never gain AWS credentials either -- it never calls
# aws-actions/configure-aws-credentials at all, unlike `deploy` -- the
# SAM build step here is purely local, no AWS API calls.
permissions:
  contents: read

# ASSAY_CLI_SHA: which lucid-assay commit this repo's own dogfood run
# vendors cli.oidc_signer from and runs cli.main/cli.verify from.
# Independently pinned here from sign-client.yml's own
# PROVENANCE_SOURCE_SHA -- yes, a second same-repo copy of a value that's
# currently identical to that one. Known, not an oversight: see the
# Lucid vault's "Signer SHA pinning pain" note for why a shared
# Repository Actions Variable would collapse this (and that one) into
# one source of truth with no real downside, and why that wasn't done as
# a silent side effect of adding this file -- it changes another
# already-working workflow's own pinning discipline, which deserves its
# own deliberate PR, not a drive-by bundled into new work. (A third copy,
# ci.yml's own SIGNER_SOURCE_SHA, existed until 2026-09-14, when ci.yml
# itself was folded into this file -- see "Runs this repo's own tests"
# below -- removing that copy entirely rather than requiring it be kept
# in sync.)
env:
  # This stack's known, stable HTTP API URL -- same value sign-client.yml's
  # own copy uses (kept in sync manually; both are a hardcoded literal
  # pointing at the one real deployed endpoint, not a workflow_call input,
  # since neither file has anywhere else to source it from without an
  # AWS API round-trip). Used below by `deploy`'s own post-deploy
  # functional-verification step -- see that step's comment for why this
  # job needs it too, not just sign-client.yml. Re-resolve via `aws
  # cloudformation describe-stacks --stack-name lucid-attest-service
  # --query "Stacks[0].Outputs[?OutputKey=='SignEndpoint'].OutputValue"`
  # if it ever changes.
  SIGN_ENDPOINT: https://84qfszyk5h.execute-api.us-east-1.amazonaws.com/v1/sign
  ASSAY_CLI_SHA: f1b9bc30dd851398c80830380c31a27bee5d2c25 # lucid-assay main: PR #100 (fix(mutation-testing): combine stdout+stderr instead of preferring stderr), 2026-09-14. Jumps this pin forward ~20 PRs (was PR #81/#82, 2026-09-04) specifically to bring in mutation testing (introduced PR #96, absent entirely at the old pin) -- this repo needed a real pyproject.toml/uv.lock/[tool.mutmut] first (added the same day, see build's own "Install this repo's own runtime + test dependencies" step) since _run_mutmut()'s `uv run --with mutmut==<pinned> --no-sync` requires an already-synced project venv to reuse, which this repo never had. Every CLI flag this workflow already depends on (--min-rcs, --expected-repository/--ref/--workflow, --cert-identity/--cert-oidc-issuer, --slsa-envelope, --require-slsa-build-l3, --write-verdict, --subject-name/--subject-digest, --coverage-report, --junit-xml, --sbom, --head-sha, --repository, --branch, --github-token, --repo-dir) confirmed still present at the new pin before bumping, not assumed. Real first measurement, confirmed by an actual local mutmut run against this exact pyproject.toml/uv.lock before this pin ever shipped: 105/142 mutants killed (73.9%, the "degraded" tier, ×0.85 multiplier). Closed same day, not left as a gap: added exact-message/exact-shape assertions to tests/test_app.py (status-code-only assertions were letting mangled/nulled error messages, missing response headers, and a mis-serialized signing payload all survive) -- re-measured at 136/142 (95.8%, "passed" tier, ×1.0 multiplier). The residual 6 survivors are genuine equivalent mutants, confirmed empirically and documented in src/app.py's own module docstring (not chased -- there is no input for which they behave differently).

jobs:
  # Runs this repo's own tests against the vendored cli.oidc_signer,
  # lints template.yaml, builds the real SAM package this repo deploys,
  # and mints an *unsigned* RCS attestation over it. No id-token
  # permission here at all, and no AWS credentials either -- safe to run
  # on a fork PR with no secrets.
  #
  # Folded in from a wholly separate ci.yml (2026-09-14, same day as the
  # deploy.yml consolidation): that file's own `test`/`lint` jobs ran
  # `pytest`/`sam validate --lint` a second time, entirely redundant with
  # this job's own "Run tests with coverage"/"Lint SAM template" steps
  # below -- two workflows on every single push/PR doing overlapping
  # work is exactly the "one continuous pipeline" model this whole
  # consolidation exists to establish, not a harmless coincidence just
  # because the second one couldn't deploy anything. See this repo's own
  # git history for ci.yml's last content if you need to compare.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # "Resolve PR Context for a Push-Triggered Run" below
    outputs:
      subject-name: ${{ steps.subject.outputs.subject-name }}
      subject-digest: ${{ steps.subject.outputs.subject-digest }}

    steps:
      # github.sha alone is correct for every trigger this workflow has:
      # a pull_request event's default is the refs/pull/N/merge preview
      # commit; a push event's is the actual commit that landed on main.
      - name: Checkout lucid-attest-service (this repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history needed for patch-coverage diff

      - name: Checkout pinned lucid-assay CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lucid-provenance/lucid-assay
          ref: ${{ env.ASSAY_CLI_SHA }}
          path: _assay
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            _assay/uv.lock
            uv.lock

      # --no-build: refuses to build any dependency from a source
      # distribution (which would otherwise invoke that package's own
      # build backend -- arbitrary code execution if a compromised sdist
      # ever entered the lockfile), forcing wheel-only installs.
      # --no-install-project: skips building lucid-assay itself (which
      # --no-build alone would otherwise refuse, for lack of a prebuilt
      # wheel of its own). Safe because every invocation below is `cd
      # _assay && uv run --no-sync python -m cli.main/cli.verify`, never a
      # `lucid-assay` entry-point command -- cli/ resolves via cwd on
      # sys.path regardless of whether the project was ever "installed",
      # same verified-safe pattern lucid-console's identical copy of this
      # file already uses.
      - name: Install lucid-assay dependencies
        working-directory: _assay
        run: uv sync --frozen --extra dev --no-build --no-install-project

      # lucid-assay's own dependency-lockfile detector AND its AST
      # test-suite walker both walk --repo-dir recursively at any depth,
      # neither skipping "_assay" -- same fix every other repo in this
      # platform already carries for the lockfile half (confirmed there
      # via a real run: lucid-assay's own ~90 Python packages
      # materializing as if they were the calling repo's own).
      #
      # rm -rf _assay/tests is the newly-added half, confirmed necessary
      # by this repo's own first real run: predicate.test_verification
      # reported 985 "valid" test functions against a repo whose actual
      # test suite (tests/test_app.py) has 16 -- cli.parsers.ast's own
      # SKIP_DIR_NAMES (cli/parsers/ast/common.py) has no entry for a
      # caller-chosen checkout path like "_assay" either, so it silently
      # walked into _assay/tests/ and counted lucid-assay's own ~1035
      # test functions as this repo's. Safe to delete outright (not just
      # exclude): verified nothing under cli/ references its own tests/
      # directory at runtime, and `uv run --no-sync` executes the
      # already-synced venv's installed package, never re-parses this
      # source tree's own tests/ directory for anything.
      - name: Remove lucid-assay's own lockfile and tests from the scan
        run: rm -f _assay/uv.lock && rm -rf _assay/tests

      # Reuses _assay/ (already checked out at ASSAY_CLI_SHA for
      # cli.main/cli.verify above) rather than a second, separately-
      # pinned checkout -- needed so the test suite below runs against
      # real code.
      - name: Vendor pinned cli.oidc_signer into src/cli/
        run: |
          mkdir -p src/cli
          cp _assay/cli/__init__.py    src/cli/__init__.py
          cp _assay/cli/common.py      src/cli/common.py
          cp _assay/cli/oidc_signer.py src/cli/oidc_signer.py

      # Replaces a plain `pip install --require-hashes -r
      # src/requirements.txt` + `pip install -r requirements-dev.txt`
      # (2026-09-14, alongside adding pyproject.toml/uv.lock): the real
      # reason for this repo's own uv-managed .venv is mutation testing
      # (lucid-assay's cli/mutation/python_runner.py, via `uv run --with
      # mutmut==<pinned> --no-sync`) -- that invocation needs a real,
      # already-synced project venv to reuse, which a bare pip install
      # into the runner's system Python never provided. `--frozen`
      # refuses to deviate from the committed uv.lock at all, the same
      # (and stronger) integrity guarantee the old --require-hashes flag
      # gave; `--no-install-project` mirrors the `_assay/` sync above --
      # this repo isn't structured as an installable package either
      # (tests/test_app.py locates src/app.py via a plain sys.path
      # insert, not an import of an installed distribution). Deliberately
      # does NOT replace src/requirements.txt itself -- that file is
      # still what `sam build` actually ships in the deployed Lambda
      # package (see its own header comment); this is a second, separate
      # dependency declaration purely for this job's own test/mutation
      # environment.
      - name: Install this repo's own runtime + test dependencies
        run: uv sync --frozen --extra dev --no-build --no-install-project

      # --junitxml/--cov feed lucid-assay's own --junit-xml/--coverage-
      # report below. pytest-cov's XML report is Cobertura-shaped (the
      # --coverage-format default),
      # not a separate flag to add. `uv run --no-sync` (not a bare
      # `python3 -m pytest`), so this genuinely runs inside the venv
      # `uv sync` above just created, not the runner's own system Python.
      - name: Run tests with coverage
        run: |
          mkdir -p build
          uv run --no-sync python3 -m pytest -v --junitxml=build/junit.xml --cov=src --cov-report=xml:build/coverage.xml tests/

      - name: Lint SAM template
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
      - run: sam validate --lint

      # Generates a canonical CycloneDX SBOM of this repo via Syft, fed to
      # lucid-assay below via --sbom -- closes S2C2F SCA-2 ("License
      # Checks") and backs INV-1/ING-1 from a real, native SBOM. Same
      # recipe as lucid-console's own copy of this step (verified working
      # there first) -- --exclude './_assay/**' for the same reason: left
      # unscoped, Syft would also catalog _assay/'s own checkout (its
      # pyproject.toml, and every package installed into its .venv by `uv
      # sync` above) as if those were this repo's own components. Placed
      # before "Build SAM package" so .aws-sam/build/ doesn't exist yet
      # either -- nothing to exclude there since it's just not present.
      #
      # Same digest-verification discipline as lucid-console's own pin:
      # confirmed directly against GHCR's own API, not copied from an
      # unverified source.
      - name: Generate CycloneDX SBOM (Syft)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/anchore/syft@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            dir:. --exclude './_assay/**' -o cyclonedx-json=build/sbom.cdx.json
          test -s build/sbom.cdx.json || { echo "ERROR: Syft did not produce build/sbom.cdx.json" >&2; exit 1; }

      # Platform-agnostic vulnerability scan via Grype, pointed at the SBOM
      # Syft just generated -- same recipe as lucid-console's own copy of
      # this step, including its two real fixes: GRYPE_DB_CACHE_DIR and
      # TMPDIR both redirected (the non-root --user override has no
      # writable $HOME for either the vulnerability-DB cache or Grype's
      # own DB-update-check temp file -- see lucid-console's own comment
      # for the exact failure this closes, confirmed via a real run
      # there). Named accurately, not "vulnerability and EOL scan": Grype
      # does not detect EOL/unmaintained packages -- see lucid-console's
      # own comment for why, confirmed against Grype's own SARIF presenter
      # source.
      - name: Scan for vulnerabilities (Grype)
        run: |
          mkdir -p build/.grype-db-cache build/.grype-tmp
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e GRYPE_DB_CACHE_DIR=/workspace/build/.grype-db-cache \
            -e TMPDIR=/workspace/build/.grype-tmp \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/anchore/grype@sha256:8a93fc48da96bd6ec5981279d099b69de11541dc68fdf222fb9161f8ff284af7 \
            sbom:build/sbom.cdx.json \
            -o sarif=build/grype.sarif
          test -s build/grype.sarif || { echo "ERROR: Grype did not produce build/grype.sarif" >&2; exit 1; }

      # --use-container: matches the `deploy` job's own real build
      # exactly (see that job's own comment for why -- Lambda's actual
      # Amazon Linux 2023 execution environment, not ubuntu-latest's
      # glibc) -- so the attestation subject below genuinely reflects
      # what would ship, not a faster-but-different local build. No AWS
      # credentials needed for this step; only sam deploy (in `deploy`,
      # not called here) does.
      - name: Build SAM package
        run: sam build --use-container

      # The attestation subject: a deterministic SHA-256 of the actual
      # built Lambda function package's contents -- the closest honest
      # equivalent to another repo's own container image digest, for an
      # artifact that isn't a container. subject-name is the real
      # FunctionName from template.yaml, not an invented identifier.
      #
      # Fixed 2026-09-14: the deploy job's own independent recomputation
      # of this same digest (after downloading the artifact this step's
      # sibling job uploads -- see "Verify downloaded artifact matches
      # the attested digest" below) failed twice in real CI, identically,
      # regardless of the actions/upload-artifact|download-artifact
      # version in use -- ruling out a version-specific quirk and
      # pointing at something structural in how a zip-based artifact
      # round-trip preserves a real directory tree. The original tar
      # recipe (`--sort=name --mtime=... --owner=0 --group=0
      # --numeric-owner`, no `--mode`, walking the directory tree
      # directly) was vulnerable to two real, well-documented failure
      # modes -- confirmed by direct local reproduction, not assumed:
      # (1) GitHub's artifact storage silently drops empty directories,
      # which `tar --sort=name .` would otherwise include as an entry;
      # (2) Unix permission bits (e.g. an executable bit) are not
      # guaranteed to round-trip exactly through a zip-based artifact.
      # Either one alone reproducibly changes this digest for identical
      # file *content*. Fix: hash only regular files (`find -type f`,
      # `--no-recursion --files-from=`, so no directory entries -- empty
      # or not -- ever enter the archive), each forced to a fixed
      # absolute mode (`--mode=644`, meaningless for what actually runs
      # in Lambda -- a Python package's behavior never depends on a
      # file's Unix permission bits). Makes this digest a pure function
      # of (sorted relative file paths, file content) and nothing else --
      # not sensitive to anything an artifact transport could plausibly
      # gain or lose. Both jobs must keep this exact recipe identical.
      #
      # That fix still didn't close it -- failed a third time, identically.
      # Added a diagnostic (PR #33: build uploads its own sorted file list
      # as a small companion artifact; deploy diffs its post-download list
      # against it on any mismatch) rather than a fourth guess, and the
      # next real failure gave a definitive answer: exactly one file
      # missing, `securesystemslib/_vendor/ed25519/.gitignore` -- a stray
      # dotfile shipped inside a transitive dependency's own PyPI package
      # (sigstore -> tuf -> securesystemslib), functionally inert, zero
      # bearing on anything the Lambda actually does at runtime.
      # actions/upload-artifact's underlying glob-matching doesn't include
      # dotfiles/dotdirs by default -- real, confirmed behavior, not a
      # guess this time (the file-list diff proved it directly). Real fix:
      # `-not -path '*/.*'` excludes dotfiles/dotdirs from the digest scope
      # on both sides, so the digest only ever covers what the artifact
      # mechanism actually guarantees to preserve -- verified locally
      # (both a fixture identical except for a missing nested dotfile, and
      # this exact recipe) to produce identical digests despite the drop.
      - name: Compute attestation subject from the built SAM package
        id: subject
        run: |
          mkdir -p build
          FILELIST="build/sam-filelist.txt"
          (cd .aws-sam/build/SignFunction && find . -type f -not -path '*/.*' | LC_ALL=C sort) > "$FILELIST"
          DIGEST="$(tar --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode=644 \
            --no-recursion -cf - -C .aws-sam/build/SignFunction --files-from="$FILELIST" \
            | sha256sum | cut -d' ' -f1)"
          echo "subject-name=lucid-attest-service-sign" >> "$GITHUB_OUTPUT"
          echo "subject-digest=sha256:$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Build-side file count: $(wc -l < "$FILELIST")"
          echo "Build-side total size (bytes): $(du -sb .aws-sam/build/SignFunction | cut -f1)"

      # Diagnostic-only, not the trust boundary itself (that's the digest
      # comparison below) -- added 2026-09-14 after two consecutive real
      # CI failures at deploy's digest-verification step survived two
      # independent, well-reasoned fix attempts (a stale-action-version
      # theory, then a permissions/empty-dir-immune digest recipe),
      # meaning the actual mechanism was still unknown. Uploading the
      # exact sorted file list `build` saw lets `deploy` diff its own
      # post-download file list against this one directly, turning "the
      # digest differs" into "here are the exact files that differ,"
      # rather than a fourth guess.
      - name: Upload build-side file list (diagnostic)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sam-build-filelist
          path: build/sam-filelist.txt
          if-no-files-found: error

      # Fixed 2026-09-14, a real gap this consolidation pass itself
      # introduced without catching it: `deploy` used to run its OWN
      # independent `sam build --use-container` from a fresh checkout,
      # vendoring cli.oidc_signer from a SEPARATE pin (SIGNER_SOURCE_SHA,
      # not ASSAY_CLI_SHA) -- meaning the attested subject-digest above
      # could never provably describe what actually got deployed, the
      # same "build artifact vs. deploy artifact integrity gap" already
      # closed for lucid-dsse-collector (its own `build` job pushes an
      # image by digest; `deploy` re-resolves and deploys that exact
      # digest, never rebuilding). This is the equivalent for a SAM/
      # Lambda package, which has no registry to push an intermediate
      # artifact to: upload the actual built `.aws-sam/build/` directory
      # itself as a workflow artifact, so `deploy` can download and
      # deploy the literal bytes this job just hashed, never re-running
      # `sam build` at all. Same upload-artifact pin already used below
      # for unsigned-statements, for consistency.
      - name: Upload SAM build output (deploy job consumes this, never rebuilds)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sam-build-output
          path: .aws-sam/build/
          if-no-files-found: error

      # push:branches:[main] carries no PR context of its own -- looks up
      # whichever PR GitHub associates with the pushed commit (works for
      # merge/squash/rebase alike). Empty outputs (no associated PR) is a
      # legitimate, handled case -- the mint step below falls back to no
      # PR context exactly as it already does for workflow_dispatch.
      - name: Resolve PR Context for a Push-Triggered Run
        id: pr-context
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Right after a merge, GitHub's own "list PRs associated with
          # commit" API can return an empty response body while its
          # backend indexing catches up -- confirmed for real (2026-09-03,
          # lucid-dsse-collector, immediately after merging a real PR): jq
          # then fails with "unexpected end of JSON input" on the empty
          # string, a transient race, not a persistent state. Bounded
          # retry (5 attempts, 3s apart -- provably bounded, never an
          # unbounded/tight loop, same discipline cli/oidc_signer.py's own
          # ambient-token-fetch retry already uses) rather than a single
          # unguarded call.
          pulls_json=""
          for attempt in 1 2 3 4 5; do
            pulls_json="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls")"
            echo "$pulls_json" | jq -e . >/dev/null 2>&1 && break
            echo "WARNING: attempt $attempt/5: commits/.../pulls returned non-JSON (likely a GitHub indexing race right after a merge) -- retrying in 3s" >&2
            sleep 3
          done
          echo "$pulls_json" | jq -e . >/dev/null 2>&1 || { echo "ERROR: commits/.../pulls never returned valid JSON after 5 attempts" >&2; exit 1; }
          echo "base-sha=$(echo "$pulls_json" | jq -r '.[0].base.sha // empty')" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$pulls_json" | jq -r '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      # No --sign/--dry-run-sign here: this job has no id-token permission.
      # Written unsigned; the separate `attest` job (the only one with
      # id-token: write) signs it from the artifact uploaded below.
      #
      # No GitHub App token: unlike every other repo in this platform,
      # this repo has no App installed on it yet (no APP_ID/APP_PRIVATE_KEY
      # configured) -- branch governance runs off the ambient default
      # github.token instead, which can't see rules-for-branch
      # (Administration: Read) but is enough for the S2C2F checks that
      # don't need it (vulnerability-alerts, dependabot/alerts, community-
      # profile). Branch governance itself degrades to
      # branch_governance_unverified until an App gets installed here too
      # -- expected on a first run, not a bug.
      #
      # --min-rcs 0: see this file's own header for why -- no observed
      # baseline yet, raise deliberately once one exists.
      - name: Mint unsigned Lucid RCS attestation
        id: mint
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.pr-context.outputs.base-sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || steps.pr-context.outputs.number }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.event.pull_request.base.ref || github.ref_name }}
          SUBJECT_NAME: ${{ steps.subject.outputs.subject-name }}
          SUBJECT_DIGEST: ${{ steps.subject.outputs.subject-digest }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$BASE_SHA" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "ERROR: BASE_SHA resolved but PR_NUMBER did not; refusing to mint with inconsistent PR context" >&2
              exit 1
            fi
            EXTRA_ARGS=(--base-sha "$BASE_SHA" --pr-number "$PR_NUMBER")
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "ERROR: github.event.pull_request.base.sha was empty on a pull_request event; refusing to guess a base commit" >&2
            exit 1
          fi

          cd _assay && uv run --no-sync python -m cli.main \
            --repo-dir "$GITHUB_WORKSPACE" \
            --junit-xml "$GITHUB_WORKSPACE/build/junit.xml" \
            --coverage-report "$GITHUB_WORKSPACE/build/coverage.xml" \
            --coverage-format cobertura \
            --sbom "$GITHUB_WORKSPACE/build/sbom.cdx.json" \
            --sarif "$GITHUB_WORKSPACE/build/grype.sarif" \
            --subject-name "$SUBJECT_NAME" \
            --subject-digest "$SUBJECT_DIGEST" \
            --head-sha "${HEAD_SHA}" \
            --repository "${{ github.repository }}" \
            --branch "${BRANCH_NAME}" \
            --github-token "${{ github.token }}" \
            --min-rcs 0 \
            --out "$GITHUB_WORKSPACE/build/lucid-attest-service.unsigned.json" \
            "${EXTRA_ARGS[@]}"

          # --sbom above also makes cli.main write a *second*, separate
          # in-toto statement wrapping the SBOM's own raw document --
          # same fixed-basename-sibling-of-out convention lucid-console's
          # own copy of this check documents.
          test -s "$GITHUB_WORKSPACE/build/sbom.unsigned.json" || {
            echo "ERROR: --sbom was passed but build/sbom.unsigned.json was not produced (see the mint step's own stderr WARNING above for why)" >&2
            exit 1
          }

      - name: Upload unsigned statements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-statements
          path: |
            build/lucid-attest-service.unsigned.json
            build/sbom.unsigned.json
          if-no-files-found: error

  # The only job with id-token: write. Signs the assay/v1 RCS statement
  # `build` uploaded via this repo's own already-deployed sign-client.yml
  # -- see this file's own header for why the `uses:` pin below is the
  # same already-trusted commit every external caller uses, not this
  # run's own in-review code.
  attest:
    needs: build
    permissions:
      id-token: write # Required for Sigstore keyless OIDC minting
      contents: read
    uses: lucid-provenance/lucid-attest-service/.github/workflows/sign-client.yml@231039b08b91b78788dba732a10355aafcaeaa11
    with:
      artifact-name: unsigned-statements
      statement-files: |
        lucid-attest-service.unsigned.json
        sbom.unsigned.json
      subject-name: ${{ needs.build.outputs.subject-name }}
      subject-digest: ${{ needs.build.outputs.subject-digest }}

  # Downloads the signed envelope and evaluates lucid-assay's own admission
  # policy gate against it. No id-token permission -- verifying a
  # signature doesn't require one, only minting one does.
  verify:
    # `build` added alongside the pre-existing `attest` dependency solely
    # so "Publish Signed Bundle to lucid-dsse-collector" below can read
    # needs.build.outputs.subject-digest -- doesn't change the DAG's
    # actual critical path, since `attest` already depends on `build`.
    # Same addition lucid-assay's own assay.yml made for the identical
    # reason.
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout this repo's own workflow file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows/assay.yml
          sparse-checkout-cone-mode: false

      # Scoped to our own well-known `attest:` job shape, not a general
      # YAML parser -- same discipline as every other repo's own copy of
      # this step.
      - name: "Derive expected signer identity from the attest job's own uses: pin"
        id: signer
        run: |
          SIGNER_USES="$(awk '/^  attest:/{f=1} f && /^ *uses:/{print; exit}' \
            .github/workflows/assay.yml | sed -E 's/^\s*uses:\s*([^ ]+).*/\1/')"
          if [ -z "$SIGNER_USES" ]; then
            echo "ERROR: could not parse the attest job's uses: line from .github/workflows/assay.yml -- did the job shape change?" >&2
            exit 1
          fi
          echo "cert-identity=https://github.com/${SIGNER_USES}" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned lucid-assay CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lucid-provenance/lucid-assay
          ref: ${{ env.ASSAY_CLI_SHA }}
          path: _assay
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "_assay/uv.lock"

      # --no-build: refuses to build any dependency from a source
      # distribution (which would otherwise invoke that package's own
      # build backend -- arbitrary code execution if a compromised sdist
      # ever entered the lockfile), forcing wheel-only installs.
      # --no-install-project: skips building lucid-assay itself (which
      # --no-build alone would otherwise refuse, for lack of a prebuilt
      # wheel of its own). Safe because every invocation below is `cd
      # _assay && uv run --no-sync python -m cli.main/cli.verify`, never a
      # `lucid-assay` entry-point command -- cli/ resolves via cwd on
      # sys.path regardless of whether the project was ever "installed",
      # same verified-safe pattern lucid-console's identical copy of this
      # file already uses.
      - name: Install lucid-assay dependencies
        working-directory: _assay
        run: uv sync --frozen --extra dev --no-build --no-install-project

      - name: Cache Sigstore TUF metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/sigstore-python
          key: sigstore-tuf-${{ runner.os }}-${{ env.ASSAY_CLI_SHA }}
          restore-keys: |
            sigstore-tuf-${{ runner.os }}-

      - name: Download signed statements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-statements
          path: build

      # --disallow-degraded deliberately OMITTED: this repo has no GitHub
      # App installed yet (see the mint step's own comment above), so
      # branch governance is expected to degrade on every run until that
      # changes -- gating hard on it here would fail every run, forever,
      # for a structural reason, not a real gap. Revisit once an App is
      # installed on this repo, same as every other repo's own path to
      # eventually enabling this flag.
      - name: Verify Lucid attestation (RCS gate + SLSA Source/Build tracks)
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          CERT_IDENTITY: ${{ steps.signer.outputs.cert-identity }}
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
          EXPECTED_WORKFLOW: ${{ github.workflow }}
        run: |
          # --require-slsa-build-l3: enabled 2026-09-03, platform-wide.
          # Independent of the --min-rcs 0 / --disallow-degraded-omitted
          # caveats above -- both about RCS threshold and branch
          # governance, unrelated to the Build Track. Both Build Level 3
          # items have been genuinely passing for real on every current
          # caller across the platform since the lucid-attest-service
          # cutover -- confirmed against a real CI run on this repo the
          # same day this flag was flipped, not assumed. Requires
          # ASSAY_CLI_SHA >= lucid-assay PR #76 (the dependency-
          # materialization decoupling -- Build Level 3 no longer requires
          # a third, dependency-related item this repo's own Lambda
          # package couldn't reliably satisfy, having no lockfile of its
          # own to hash-pin against).
          VERIFY_ARGS=(
            --min-rcs 0
            --expected-repository "$EXPECTED_REPOSITORY"
            --expected-ref "$EXPECTED_REF"
            --expected-workflow "$EXPECTED_WORKFLOW"
            --cert-identity "$CERT_IDENTITY"
            --cert-oidc-issuer "$CERT_OIDC_ISSUER"
            --slsa-envelope ../build/provenance.dsse.json
            --require-slsa-build-l3
            --write-verdict
          )

          cd _assay && uv run --no-sync python -m cli.verify ../build/lucid-attest-service.dsse.json "${VERIFY_ARGS[@]}"

      - name: Upload signed attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lucid-attest-service-attestation
          path: |
            build/lucid-attest-service.dsse.json
            build/provenance.dsse.json
            build/sbom.dsse.json
          if-no-files-found: error

      # Publishes this run's signed bundle to lucid-dsse-collector, the
      # ingestion gateway backing the Lucid console/PR bot. Identical
      # step to lucid-assay's own copy (see that repo's assay.yml for the
      # fuller rationale on every choice below) -- dormant until
      # LUCID_DSSE_COLLECTOR_URL is set as a repo/org variable,
      # continue-on-error since ingestion is fire-and-forget from this
      # pipeline's perspective, no auth header needed (caller identity
      # comes from each envelope's own embedded Sigstore signature).
      # needs.build.outputs.subject-digest, not .image-digest -- this
      # repo's own subject isn't a container image (see this workflow's
      # own top-of-file comment on --subject-name/--subject-digest), but
      # the collector's metadata.image_digest field is still the right
      # place for whatever digest identifies this run's subject.
      - name: Publish Signed Bundle to lucid-dsse-collector
        if: vars.LUCID_DSSE_COLLECTOR_URL != ''
        continue-on-error: true
        env:
          COLLECTOR_URL: ${{ vars.LUCID_DSSE_COLLECTOR_URL }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.subject-digest }}
        run: |
          METADATA=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg sha "$COMMIT_SHA" \
            --arg ref "$REF" \
            --arg digest "${IMAGE_DIGEST#sha256:}" \
            '{repository: $repo, commit_sha: $sha, ref: $ref, image_digest: $digest}')

          FORM_ARGS=(-F "metadata=${METADATA};type=application/json")
          for envelope in build/lucid-attest-service.dsse.json build/provenance.dsse.json build/sbom.dsse.json build/sarif-reports.dsse.json; do
            if [ -f "$envelope" ]; then
              FORM_ARGS+=(-F "envelopes=@${envelope};type=application/json")
            fi
          done

          curl -sSf -X POST "${COLLECTOR_URL%/}/api/v1/attestations" "${FORM_ARGS[@]}"

  # Deploys the SAM stack via GitHub Actions OIDC -- no static AWS keys
  # anywhere. Folded in from a wholly separate `deploy.yml` (2026-09-14),
  # closing the same architecture gap already found and fixed in
  # lucid-dsse-collector's own copy of this file (2026-09-13): that file
  # had its own independent `push: branches: [main]` trigger, racing
  # this workflow's own push-triggered run on the identical commit, with
  # no ordering guarantee between them at all -- whether the deployed
  # Lambda package was even built from a commit that had passed `verify`
  # was never actually checked, just assumed from both firing off the
  # same push. `needs: verify` below means this job structurally cannot
  # start before `build`/`attest`/`verify` have all completed on this
  # exact commit -- no polling, no second workflow run, no race. Not a
  # reversion to the `workflow_run` pattern this platform has already
  # ruled out elsewhere for the same "pwn request" reason -- `needs:`
  # sequences jobs *within* one triggered run, off one event; it never
  # checks out another run's `head_sha` under a different trigger's
  # privilege context.
  #
  # `if: github.event_name != 'pull_request'` -- this workflow also runs
  # on `pull_request`, and an unreviewed PR must never deploy.
  # `workflow_dispatch` is intentionally still allowed to deploy, same as
  # the original `deploy.yml`'s own trigger.
  #
  # SIGNER_SOURCE_SHA (a separate pin from this workflow's own
  # ASSAY_CLI_SHA -- previously "known, not an oversight," per this
  # comment's own earlier text) no longer exists here at all: fixed
  # 2026-09-14, this job used to vendor cli.oidc_signer from that
  # separate pin and run its own independent `sam build`, meaning the
  # attested subject-digest never provably described what got deployed
  # -- see build's own "Upload SAM build output" step and this job's
  # "Download SAM build output"/"Verify downloaded artifact" steps below
  # for the real fix (build once, verify the exact bytes, never rebuild).
  # This isn't the "collapse SIGNER_SOURCE_SHA into ASSAY_CLI_SHA as a
  # drive-by" move that comment was cautioning against -- the variable is
  # gone because this job no longer builds anything that would need it,
  # not because the two pins were unified as a style choice.
  # sign-client.yml's own separate pin is untouched.
  #
  # `needs: [build, verify]` (build added alongside the pre-existing
  # verify dependency) solely so "Verify downloaded artifact" below can
  # read needs.build.outputs.subject-digest -- doesn't change the DAG's
  # actual critical path, since verify already depends on build
  # transitively. Same pattern verify's own needs: list uses above, for
  # the same reason.
  deploy:
    needs: [build, verify]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Queues rather than races a concurrent deploy against the same
    # stack -- the workflow-level concurrency group above is now keyed
    # by github.sha, so two different commits' own deploy jobs could in
    # principle run at the same time without this; cancel-in-progress:
    # false so a queued deploy always still runs (never silently
    # dropped), matching lucid-dsse-collector's own `deploy-staging`
    # job-level guard.
    concurrency:
      group: lucid-attest-service-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      # Fixed 2026-09-14: this job used to check out a separately-pinned
      # lucid-assay signer source (SIGNER_SOURCE_SHA, a DIFFERENT commit
      # than `build`'s own ASSAY_CLI_SHA) and run its own independent
      # `sam build --use-container` from scratch -- meaning the package
      # actually deployed here was never provably the same bytes `build`
      # hashed and attested. This job no longer builds anything at all;
      # it downloads and deploys the exact `.aws-sam/build/` output
      # `build` already produced, verified below. `checkout` is still
      # needed for `sam deploy`'s own CLI invocation and this file's own
      # concurrency-group name, not for building.
      - name: Checkout lucid-attest-service (this repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Downloads the literal build output `build` job already produced
      # and uploaded -- see that job's own "Upload SAM build output"
      # step for why. `sam deploy` (below) reads `.aws-sam/build/
      # template.yaml` from this directory by its own default convention
      # -- the same build-once-deploy-from-artifact shape SAM's own
      # reference CI/CD pipelines document, not an unusual pattern
      # invented here.
      - name: Download SAM build output (never rebuilds)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sam-build-output
          path: .aws-sam/build/

      # Diagnostic-only companion to the digest check below -- see
      # build's own "Upload build-side file list" step for why this
      # exists (two prior fix attempts, both wrong, with no visibility
      # into whether the file *set* or the file *content* was actually
      # diverging).
      - name: Download build-side file list (diagnostic)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sam-build-filelist
          path: build-side

      # Independently re-derives the digest from the artifact this job
      # actually downloaded -- same tar recipe `build`'s own "Compute
      # attestation subject" step used -- and asserts it equals what got
      # attested (needs.build.outputs.subject-digest), rather than
      # trusting the download (or `needs.*.outputs`) at face value. Same
      # "never trust a propagated value, re-check the actual bytes"
      # discipline lucid-dsse-collector's own `deploy` job uses when it
      # re-resolves its image digest from GHCR rather than trusting
      # needs.build.outputs.image-digest directly. A mismatch here means
      # either GitHub Actions' own artifact transport was tampered with
      # or corrupted, or `build` computed its digest from something other
      # than what it uploaded -- either way, this must never deploy.
      #
      # On a mismatch, diffs this job's own post-download file list
      # against the exact one `build` saw before upload -- distinguishes
      # "the file *set* changed in transport" (the diff is non-empty)
      # from "the set is identical but content/bytes differ" (the diff
      # is empty despite the digest mismatch), rather than a fourth
      # guess with no more information than the last two had.
      - name: Verify downloaded artifact matches the attested digest
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.subject-digest }}
        run: |
          FILELIST="$(mktemp)"
          (cd .aws-sam/build/SignFunction && find . -type f -not -path '*/.*' | LC_ALL=C sort) > "$FILELIST"
          ACTUAL_DIGEST="sha256:$(tar --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode=644 \
            --no-recursion -cf - -C .aws-sam/build/SignFunction --files-from="$FILELIST" \
            | sha256sum | cut -d' ' -f1)"
          if [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "ERROR: downloaded SAM build output does not match the attested subject-digest." >&2
            echo "  expected: $EXPECTED_DIGEST" >&2
            echo "  actual:   $ACTUAL_DIGEST" >&2
            echo "  downloaded file count: $(wc -l < "$FILELIST") (build-side: $(wc -l < build-side/sam-filelist.txt))" >&2
            echo "  downloaded total size (bytes): $(du -sb .aws-sam/build/SignFunction | cut -f1)" >&2
            echo "  file-list diff (< build-side, > this download):" >&2
            diff build-side/sam-filelist.txt "$FILELIST" >&2 || true
            exit 1
          fi
          echo "Verified: downloaded build output matches attested digest ($ACTUAL_DIGEST)"

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::133307902115:role/lucid-attest-service-deploy
          aws-region: us-east-1

      # Still needed for the `sam` CLI binary itself (sam deploy below),
      # even though this job never calls `sam build` any more.
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      # --s3-bucket named explicitly, not --resolve-s3: the deploy role's
      # IAM policy is scoped to this one bucket by name (no s3:CreateBucket
      # at all -- bucket creation is a one-time, human, out-of-band step).
      # Letting SAM auto-manage its own bucket would pick a name this
      # policy was never scoped to and fail closed with AccessDenied.
      #
      # Bucket created 2026-09-02 in S3's account-Regional namespace (AWS's
      # current recommended default over the classic global namespace) --
      # that namespace always appends an account+region suffix to whatever
      # prefix you type, so the real bucket name isn't the bare
      # "lucid-attest-service-sam-artifacts" prefix, it's the full name
      # below, exactly as the console computed it. --s3-prefix (SAM's own
      # object-key prefix *inside* the bucket, unrelated to S3's bucket-
      # namespace prefix above) is untouched.
      - run: |
          sam deploy \
            --stack-name lucid-attest-service \
            --s3-bucket lucid-attest-service-sam-artifacts-133307902115-us-east-1-an \
            --s3-prefix lucid-attest-service \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region us-east-1

      # Diagnostic, not a gate: `sam deploy` succeeding above only proves
      # CloudFormation accepted the changeset, not that the specific bytes
      # this run attested are what's actually live -- closing an
      # architecture-audit finding (2026-09-14) that this repo, unlike
      # lucid-dsse-collector's own `deploy` job, had no step at all that
      # looked at the *running* function after deploy. CodeSha256 is AWS's
      # own hash of the deployed zip package -- a different hash domain
      # than `subject-digest` above (a content-tar hash over the built
      # package's extracted files, chosen so the digest survives a
      # zip-artifact round-trip through GitHub Actions -- see "Compute
      # attestation subject from the built SAM package"'s own comment).
      # The two are never compared for equality here; deliberately not
      # trying to make them the same value. This step exists so an
      # auditor has an AWS-native, independently-queryable identifier
      # (`aws lambda get-function-configuration`) for what's genuinely
      # running, recorded alongside this run's own attested subject-digest
      # rather than only ever trusting this pipeline's own claim.
      # continue-on-error: true -- the deploy role's IAM policy isn't
      # committed as code anywhere in this repo (a separate, tracked
      # audit gap -- see the Lucid vault's #12 milestone note), so
      # whether it already includes lambda:GetFunctionConfiguration isn't
      # something this change can confirm ahead of a real run; a missing
      # permission here must never fail an otherwise-successful deploy.
      - name: Capture live Lambda code identity (best-effort, diagnostic)
        continue-on-error: true
        run: |
          CODE_SHA256="$(aws lambda get-function-configuration \
            --function-name lucid-attest-service-sign \
            --query 'CodeSha256' --output text)"
          {
            echo "### Live Lambda code identity"
            echo ""
            echo "- Function: \`lucid-attest-service-sign\`"
            echo "- AWS CodeSha256 (hash of the deployed zip, AWS's own value): \`$CODE_SHA256\`"
            echo "- This run's attested subject-digest (content-tar hash, see build job): \`${{ needs.build.outputs.subject-digest }}\`"
            echo ""
            echo "These are two different hash domains over the same package -- not expected to be equal, both recorded for independent auditability."
          } >> "$GITHUB_STEP_SUMMARY"

      # The actual close-the-loop gate: proves the function `sam deploy`
      # just updated genuinely signs through real Fulcio/Rekor right now,
      # not just that CloudFormation reported success. Mirrors
      # smoke-test-sign.yml's own real-sign + real-Rekor-entry checks
      # (that workflow proved this exact request/response shape works;
      # this step is the same check, wired into the deploy gate itself
      # instead of staying manual-only) -- but binds the test statement's
      # subject to this run's own real attested digest, not a fixed
      # synthetic placeholder, so the resulting Rekor entry is provably
      # tied to this specific deploy rather than a generic ping. A
      # failure here fails the whole `deploy` job: an update that reached
      # CloudFormation but can't actually sign is not a successful
      # deploy by this platform's own definition of what this service is
      # for.
      - name: Mint ambient OIDC identity token (post-deploy check)
        id: verify-live
        uses: ./.github/actions/mint-sigstore-oidc-token
      - name: Post-deploy functional verification (real Sigstore sign + Rekor)
        env:
          OIDC_TOKEN: ${{ steps.verify-live.outputs.token }}
          SUBJECT_NAME: ${{ needs.build.outputs.subject-name }}
          SUBJECT_DIGEST: ${{ needs.build.outputs.subject-digest }}
        run: |
          digest_hex="${SUBJECT_DIGEST#sha256:}"
          statement='[{
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [{"name": "'"$SUBJECT_NAME"'", "digest": {"sha256": "'"$digest_hex"'"}}],
            "predicateType": "https://lucid-provenance.io/attestations/post-deploy-verification/v1",
            "predicate": {"note": "deploy job'"'"'s own post-deploy functional gate, not a manual smoke test", "run_id": "${{ github.run_id }}", "deployed_sha": "${{ github.sha }}"}
          }]'

          http_code="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$SIGN_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -d "$statement")"

          echo "HTTP status: $http_code"
          cat response.json
          echo

          if [ "$http_code" != "200" ]; then
            echo "ERROR: expected HTTP 200 from the just-deployed endpoint, got $http_code" >&2
            exit 1
          fi

          envelope_count="$(jq '.envelopes | length' response.json)"
          if [ "$envelope_count" != "1" ]; then
            echo "ERROR: expected exactly 1 envelope, got $envelope_count" >&2
            exit 1
          fi

          sig="$(jq -r '.envelopes[0].signatures[0].sig' response.json)"
          if [ -z "$sig" ] || [ "$sig" = "null" ]; then
            echo "ERROR: no signature present in the response" >&2
            exit 1
          fi

          log_index="$(jq -r '.envelopes[0]._rekor.logIndex' response.json)"
          log_url="$(jq -r '.envelopes[0]._rekor.logUrl' response.json)"
          if [ -z "$log_index" ] || [ "$log_index" = "null" ]; then
            echo "ERROR: no Rekor transparency-log entry (_rekor.logIndex is null) -- the deployed function did not perform a real sign" >&2
            exit 1
          fi

          {
            echo "### Post-deploy verification: real sign confirmed"
            echo ""
            echo "The just-deployed function produced a genuine Sigstore signature and Rekor transparency-log entry:"
            echo ""
            echo "- Rekor log index: \`$log_index\`"
            echo "- Rekor entry: $log_url"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Post-deploy verification passed. Rekor entry: $log_url"
