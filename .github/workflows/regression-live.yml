name: Live Regression Suite (nightly + on-demand)

# The full tests/live/ suite -- everything assay.yml's `deploy` job's own
# lean, blocking post-deploy gate deliberately does NOT run
# (test_request_validation.py, and the `stress`-marked multi-statement
# batch case) -- against the real deployed endpoint. Mirrors
# lucid-dsse-collector's own regression-live.yml in structure and intent;
# see tests/live/conftest.py for the places this service's real shape
# (stateless, single-endpoint, OIDC-gated, and -- unlike dsse-collector --
# every real sign call mints a permanent public Rekor entry) makes the
# split reasoning different, not just the file list.
#
# Runs nightly (04:00 UTC) unconditionally with the full suite including
# `stress`, and on-demand any other time. Deliberately decoupled from the
# deploy gate itself: none of this should block shipping a fix just
# because a slower/heavier check is having a bad day -- same reasoning
# lucid-dsse-collector's own copy of this file already documents.
#
# No push/pull_request trigger, deliberately: every real-signing test
# here (test_critical_path.py, test_batch_stress.py) mints permanent,
# public Rekor transparency-log entries -- not something to fire on every
# commit, the same reason smoke-test-sign.yml has stayed workflow_dispatch-
# only since it was first added.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      run_stress:
        description: "Also run the stress-marked case (signs a 5-statement batch in one real call, minting 5 additional Rekor entries)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SIGN_ENDPOINT: https://84qfszyk5h.execute-api.us-east-1.amazonaws.com/v1/sign

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required to mint the ambient OIDC token below -- no other step in this workflow needs it
      contents: read

    steps:
      # Needed so the local composite action below (a real file in this
      # checkout) is actually present on the runner's filesystem, and so
      # tests/live/ itself is present to run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install this repo's own test dependencies
        run: uv sync --frozen --extra dev --no-build --no-install-project

      - name: Mint ambient OIDC identity token (audience sigstore)
        id: oidc
        uses: ./.github/actions/mint-sigstore-oidc-token

      - name: Run the live regression suite
        # github.event_name is a fixed, GitHub-provided value (not
        # caller-controlled) but inputs.run_stress is -- routed through
        # an env var for the same reason lucid-dsse-collector's own copy
        # of this step already documents, not because a typed boolean
        # input is known to be exploitable today.
        env:
          LIVE_SIGN_ENDPOINT: ${{ env.SIGN_ENDPOINT }}
          LIVE_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_STRESS_INPUT: ${{ inputs.run_stress }}
        run: |
          # Nightly (schedule) always runs the full suite, stress
          # included -- the one cadence a check that mints extra
          # permanent Rekor entries is meant to land on.
          # workflow_dispatch defaults to skipping `stress` unless
          # explicitly requested via run_stress.
          MARKER_EXPR="not stress"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$RUN_STRESS_INPUT" = "true" ]; then
            MARKER_EXPR=""
          fi
          if [ -n "$MARKER_EXPR" ]; then
            uv run --no-sync --no-build python3 -m pytest tests/live/ -m "$MARKER_EXPR" -v
          else
            uv run --no-sync --no-build python3 -m pytest tests/live/ -v
          fi
