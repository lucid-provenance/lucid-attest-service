name: Sign (client)

# Reusable workflow: the isolated control-plane for a caller adopting
# lucid-attest-service. Structurally the same role as lucid-attest's own
# sign.yml (constructs SLSA v1.0 provenance from ITS OWN trusted context,
# then signs both the caller's statement(s) and the provenance
# atomically) -- but delegates the actual Sigstore cryptographic
# operation to this repo's shared Lambda instead of running a pinned
# Docker image locally. See the Lucid vault's #12 milestone note and its
# "Serverless signer needs a trustworthy provenance builder identity"
# open question for the full trust-model reasoning this implements.
#
# Why this MUST be a reusable workflow, never inlined into a caller's own
# assay.yml: GitHub's OIDC job_workflow_ref claim -- and hence the Fulcio
# certificate identity Sigstore issues -- reflects THIS file's own path
# for a job that mints its own token inside a reusable-workflow
# invocation, regardless of which repo's `uses:` line called it. That's
# what makes a single, individually-reviewed entry in lucid-assay's
# TRUSTED_CONTROL_PLANE_BUILDER_IDS (cli/verify.py) sufficient to trust
# every caller of this file, the same way lucid-attest's sign.yml is
# trusted today via its own one entry there. Inlining this logic into
# each caller's own workflow file instead would make every caller's own
# file its own unreviewed identity, defeating the point entirely --
# cli/verify.py would need to trust an unbounded, ever-growing set of
# per-tenant identities it can't individually review.
#
# id-token: write is granted to exactly one job, in exactly one workflow,
# in this one repo -- no other job anywhere in a calling repo's own
# workflow needs it, or should have it, to adopt this service.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the workflow-run artifact containing the unsigned *.unsigned.json statement files"
        required: true
        type: string
      statement-files:
        description: "Newline-separated list of *.unsigned.json filenames (within artifact-name) to sign"
        required: true
        type: string
      subject-name:
        description: "Optional: the attested artifact's name (e.g. an image ref). Together with subject-digest, opts this run into also constructing a SLSA v1.0 provenance statement inside this isolated job (SLSA Build Level 3) and signing it alongside the caller's own statement(s). Omit both to keep signing exactly the files named in statement-files, unchanged -- same contract as lucid-attest's sign.yml."
        required: false
        type: string
        default: ""
      subject-digest:
        description: "Optional: sha256:<hex> or bare hex digest of the artifact named by subject-name. Required together with subject-name; ignored if subject-name is empty."
        required: false
        type: string
        default: ""
    outputs:
      artifact-name:
        description: "Name of the workflow-run artifact this job uploads the signed *.dsse.json envelopes to"
        value: signed-statements

permissions: {}

env:
  # Pinned lucid-assay source for cli.provenance's SLSA Build Level 3
  # provenance construction ONLY -- this workflow never calls
  # cli.oidc_signer itself, signing happens via SIGN_ENDPOINT below
  # instead. cli.provenance's whole import chain (cli.provenance,
  # cli.slsa_provenance, cli.common, cli.parsers.lockfiles) is pure
  # stdlib -- verified empirically, not assumed -- so no dependency
  # install step is needed for it, just this checkout.
  #
  # A hardcoded literal, never a workflow_call input, same discipline as
  # deploy.yml/ci.yml's own SIGNER_SOURCE_SHA: which lucid-assay commit's
  # provenance-construction code this job runs is a deliberate,
  # reviewable commit to *this* file, not a caller-controlled value.
  PROVENANCE_SOURCE_SHA: "e7f224511ec68b0a342400cb837e1dee27abf133"

  # This stack's known, stable HTTP API URL -- see deploy.yml's own
  # SignEndpoint output comment for how to re-resolve it if it ever
  # changes.
  SIGN_ENDPOINT: https://84qfszyk5h.execute-api.us-east-1.amazonaws.com/v1/sign

  # This file's OWN identity -- MUST exactly match the entry this
  # workflow's cutover PR adds to lucid-assay's cli/verify.py
  # TRUSTED_CONTROL_PLANE_BUILDER_IDS, and is passed explicitly to
  # cli.provenance's --builder-id (never left to its own
  # ambient-derivation fallback -- see that flag's own help text: inside
  # a workflow_call job, GITHUB_WORKFLOW_REF reflects the *calling*
  # workflow, not this one, the same gap sign.yml's own
  # CONTROL_PLANE_BUILDER_ID works around).
  CONTROL_PLANE_BUILDER_ID: https://github.com/lucid-provenance/lucid-attest-service/.github/workflows/sign-client.yml

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Sigstore keyless OIDC minting -- see file header
      contents: read

    steps:
      # Read-only, for lockfile scanning ONLY -- nothing from this
      # checkout is ever executed (no build/test/install step touches
      # it). github.sha here is the *calling* workflow run's own commit
      # (workflow_call jobs inherit the caller's github.* context for
      # ordinary context values -- unlike the OIDC token's own
      # job_workflow_ref claim, which never does, see this file's own
      # header), so this is genuinely the source commit the caller's
      # build job built from. Skipped entirely when the caller didn't
      # opt into provenance construction (no subject-name given).
      - name: Checkout Caller Source (read-only, for dependency scanning only)
        if: inputs.subject-name != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: _source
          persist-credentials: false

      - name: Checkout pinned lucid-assay (cli.provenance only)
        if: inputs.subject-name != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lucid-provenance/lucid-assay
          ref: ${{ env.PROVENANCE_SOURCE_SHA }}
          path: _assay
          persist-credentials: false

      - name: Download Unsigned Statements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: unsigned

      # Constructs a SLSA v1.0 provenance statement from THIS job's own
      # ambient GitHub Actions context (pure-stdlib cli.provenance,
      # checked out above) -- source binding and resolved dependencies
      # come from here, never from anything the untrusted build job
      # claims. --builder-id is this file's own hardcoded identity (see
      # env.CONTROL_PLANE_BUILDER_ID's own comment above). Written into
      # ./unsigned/ alongside the caller's own statement(s) purely so the
      # signing step below can treat it identically; it was not part of
      # what the caller uploaded.
      - name: Construct SLSA Provenance (Build Level 3)
        if: inputs.subject-name != ''
        env:
          SUBJECT_NAME: ${{ inputs.subject-name }}
          SUBJECT_DIGEST: ${{ inputs.subject-digest }}
          BUILDER_ID: ${{ env.CONTROL_PLANE_BUILDER_ID }}
        run: |
          cd _assay && python3 -m cli.provenance \
            --subject-name "$SUBJECT_NAME" \
            --subject-digest "$SUBJECT_DIGEST" \
            --repo-dir "$GITHUB_WORKSPACE/_source" \
            --builder-id "$BUILDER_ID" \
            --out "$GITHUB_WORKSPACE/unsigned/provenance.unsigned.json"

      # This job *is* the caller lucid-attest-service's own /v1/sign
      # endpoint expects to have already minted its own ambient OIDC
      # identity -- see the composite action's own header for the exact
      # request shape this mirrors (cli.oidc_signer.fetch_ambient_oidc_token()'s
      # own, audience "sigstore").
      #
      # Referenced remotely (owner/repo/path@sha), NOT via a local `./`
      # path -- a local reference resolves relative to a checkout of
      # `github.repository`, which inside a workflow_call job reflects
      # the CALLER's repo (lucid-console, lucid-dsse-collector, ...), not
      # this one, the same context-inheritance gotcha this file's header
      # already documents for github.sha/github.repository generally.
      # `./mint-sigstore-oidc-token` worked by pure coincidence in
      # test-sign-client.yml (caller and callee are both this same repo
      # there) and broke immediately on the first real external caller
      # (lucid-console, 2026-09-02: "Can't find 'action.yml' ... under
      # .../lucid-console/.github/actions/mint-sigstore-oidc-token").
      # Remote-referencing needs no self-checkout step at all -- simpler
      # than reproducing PROVENANCE_SOURCE_SHA's self-pin pattern here.
      - name: Mint ambient OIDC identity token (audience sigstore)
        id: oidc
        uses: lucid-provenance/lucid-attest-service/.github/actions/mint-sigstore-oidc-token@69f843991419df4d9180a981e3bcbd96a927f7a2

      # Builds one JSON array from every file the caller named (plus the
      # just-constructed provenance statement, if any -- appended here,
      # not trusted from inputs.statement-files, so a caller can't
      # rename/omit it to dodge or duplicate this signing pass, same
      # discipline as sign.yml's own ALL_FILES construction) and POSTs it
      # to the Lambda in one call -- "single call vs one per envelope",
      # see the Lucid vault's #12 milestone note.
      #
      # inputs.statement-files is caller-supplied, so every line is
      # treated as hostile input, not a trusted filename, before it
      # touches the filesystem: rejected outright if it contains `/`,
      # `\`, or `..` (can't walk outside ./unsigned/ via a path-traversal
      # or separator sequence), and `basename -- "$f" ...` (the `--`)
      # stops a hyphen-prefixed filename from being parsed as a flag by
      # basename itself. Same guards as sign.yml's own copy of this loop.
      - name: Sign statements via lucid-attest-service
        id: sign
        env:
          STATEMENT_FILES: ${{ inputs.statement-files }}
          SUBJECT_NAME: ${{ inputs.subject-name }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          mkdir -p signed

          ALL_FILES="$STATEMENT_FILES"
          if [ -n "$SUBJECT_NAME" ]; then
            ALL_FILES="$ALL_FILES"$'\n'"provenance.unsigned.json"
          fi

          bases=()
          input_paths=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue

            case "$f" in
              */*|*\\*|*..*)
                echo "ERROR: rejecting unsafe statement filename: $f" >&2
                exit 1
                ;;
            esac

            base="$(basename -- "$f" .unsigned.json)"
            bases+=("$base")
            input_paths+=("unsigned/$f")
          done <<< "$ALL_FILES"

          echo "Signing ${#bases[@]} statement(s): ${bases[*]}"

          # jq -s (slurp): reads each file as one JSON value and wraps
          # them all into a single top-level array, in argument order --
          # exactly the batch shape lucid-attest-service's POST /v1/sign
          # expects. Written straight to a file, never held in a shell
          # variable -- a real statement (e.g. a lockfile-derived
          # resolved_dependencies list) plus its provenance sibling can
          # exceed the kernel's execve() argument+environment size limit
          # (ARG_MAX) when passed as `curl -d "$batch"`, which fails as
          # "Argument list too long" (exit 126). test-sign-client.yml's
          # fake statement is tiny and never exercised this; lucid-console's
          # real statement did, immediately. curl --data-binary @file reads
          # the payload from disk instead, with no argument-length limit
          # and no byte-mangling (unlike -d, which strips CRs).
          jq -s '.' "${input_paths[@]}" > batch.json

          http_code="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$SIGN_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            --data-binary @batch.json)"

          if [ "$http_code" != "200" ]; then
            echo "ERROR: lucid-attest-service returned HTTP $http_code:" >&2
            cat response.json >&2
            exit 1
          fi

          envelope_count="$(jq '.envelopes | length' response.json)"
          if [ "$envelope_count" != "${#bases[@]}" ]; then
            echo "ERROR: expected ${#bases[@]} envelopes back, got $envelope_count" >&2
            exit 1
          fi

          # Response envelopes are in the same order as the request batch
          # (see src/app.py's own docstring in lucid-attest-service) --
          # split back out by position, one *.dsse.json per input file,
          # matching sign.yml's own output naming exactly.
          for i in "${!bases[@]}"; do
            jq ".envelopes[$i]" response.json > "signed/${bases[$i]}.dsse.json"
          done

      - name: Upload Signed Statements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-statements
          path: signed/
          if-no-files-found: error
