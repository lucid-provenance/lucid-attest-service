AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  lucid-attest-service -- serverless signing endpoint (Lucid roadmap #12).

  Phase 2: real signing. src/app.py calls lucid-assay's
  cli.oidc_signer.sign_statement, vendored at deploy time from a pinned
  source SHA (see deploy.yml's SIGNER_SOURCE_SHA and its "Vendor pinned
  cli.oidc_signer" step) -- the same build-time-checkout discipline
  lucid-attest's own Milestone #18 build-signer-image.yml uses, though
  narrower here (see README's Status section for exactly why).

  Stack MUST be deployed as exactly "lucid-attest-service" -- the deploy
  role's CloudFormation permissions are scoped to a stack of that exact
  name (see lucid-attest-service-deploy-permissions in the Lucid vault's
  #12 milestone note).

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.13
    Architectures:
      - x86_64
    # HOME=/tmp -- confirmed necessary via a real invocation, not
    # anticipated speculatively: sigstore-python (by way of a transitive
    # dep, tuf/securesystemslib) wants to write TUF trust-root cache data
    # under $HOME, and AWS Lambda's default HOME
    # (/home/sbx_user1051-shaped) sits on a read-only filesystem -- only
    # /tmp is writable in a Lambda execution environment. Exact same fix,
    # same root cause, as lucid-attest's own Milestone #18 signer image
    # hit and documented at length in its Dockerfile (that image also
    # sets HOME=/tmp for the identical reason).
    Environment:
      Variables:
        HOME: /tmp

Resources:
  SignFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lucid-attest-service-sign
      CodeUri: src/
      Handler: app.handler
      Description: >
        Real signing handler. Validates request shape and Authorization
        header, then signs each statement via lucid-assay's
        cli.oidc_signer.sign_statement. See the module docstring in
        src/app.py.
      Events:
        Sign:
          Type: HttpApi
          Properties:
            Path: /v1/sign
            Method: post

Outputs:
  SignEndpoint:
    Description: "POST /v1/sign endpoint (HTTP API)"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1/sign"
  SignFunctionArn:
    Description: "Lambda function ARN"
    Value: !GetAtt SignFunction.Arn
